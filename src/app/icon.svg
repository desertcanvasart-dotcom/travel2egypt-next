<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Travel2Egypt favicon — italic faience "2" on paper.
    Mirrors the wordmark accent: the "2" is the brand's only consistent
    visual mark. Uses Cormorant Garamond italic; falls back to Times
    italic on systems without Cormorant.
  -->
  <rect width="64" height="64" fill="#FAF6EC"/>
  <text
    x="32"
    y="48"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Times New Roman', Times, serif"
    font-style="italic"
    font-weight="500"
    font-size="56"
    fill="#1B4965">2</text>
</svg>
